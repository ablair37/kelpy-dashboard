  const err=document.getElementById('err');
  err.textContent='';
  if(!pin){err.textContent='enter your PIN';return;}
  try{
    const v=JSON.parse(document.getElementById('vault').textContent);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(v.salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(v.iv)},key,b64(v.ct));
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){err.textContent='wrong PIN, try again';}
}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
</body></html>
